name: Release Windows App
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag de versão (ex: v3.2.3)"
                required: false
                default: "v3.2.3"

defaults:
    run:
        working-directory: apps/frontend

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Rust setup
              uses: dtolnay/rust-toolchain@stable

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install app dependencies
              run: bun install

            - name: Build app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.event.inputs.tag || github.ref_name }}
                  releaseName: "DraftGap (All Ranks & 30-Day Data) __VERSION__"
                  releaseBody: "## DraftGap Fork (All Ranks & 30-Day Data)\n\nVersão personalizada configurada obrigatoriamente com dados de todos os ranks (`tier=all`) e período de 30 dias (`patch=30`).\n\nBaixe o instalador `.msi` ou executável abaixo e instale no seu Windows."
                  projectPath: apps/frontend
                  tauriScript: bun run tauri
